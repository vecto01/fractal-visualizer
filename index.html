<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Visualizer</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <div class="fractal-container">
      <canvas id="fractalCanvas"></canvas>
      <div class="loading-spinner" id="loadingSpinner"></div>
    </div>
    
    <div class="controls-panel">
      <div class="control-group">
        <label for="fractalType">Choose Fractal:</label>
        <select id="fractalType">
          <option value="mandelbrot">Mandelbrot</option>
          <option value="julia">Julia</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="iterations">Iterations:</label>
        <input type="number" id="iterations" min="1" max="500" value="100">
      </div>
      
      <div class="control-group">
        <label for="zoom">Zoom:</label>
        <input type="number" id="zoom" min="0.1" max="10" step="0.1" value="1.0">
      </div>
      
      <button id="updateBtn" title="Update fractal settings">Update Fractal</button>
      <button id="exportBtn" title="Export fractal as PNG or SVG">Export Fractal <span class="export-icon">🖼️</span></button>
    </div>
  </div>
  
  <!-- Модальное окно для экспорта -->
  <div id="exportModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Export Fractal</h2>
      <p>Choose export format:</p>
      <div class="export-options">
        <button id="exportPngBtn" class="export-option-btn" title="Export as PNG">Export as PNG</button>
        <button id="exportSvgBtn" class="export-option-btn" title="Export as SVG">Export as SVG</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/svg.js@3.0/dist/svg.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
