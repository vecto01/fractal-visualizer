<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" aria-label="Toggle dark mode">
        <span class="moon-icon" aria-hidden="true">☽</span>
    </button>
    <button class="language-toggle" aria-label="Toggle language">
        <span class="language-text" id="language-text">EN</span>
    </button>
    <div id="loading">
        <div class="container">
            <h1>Fractal Visualizer</h1>
            <div class="loading-spinner"></div>
            <div class="loading-message">Loading fractal...</div>
            <div id="progress-container">
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="indicator"></div>
            </div>
            <button id="start-visualization-btn" class="fade-in">Start Visualization</button>
        </div>
    </div>
    <div class="container" id="fractal-container">
        <div class="success-message" id="success-message" aria-live="polite">Visualization complete!</div>
        <div id="canvas-container">
            <canvas id="fractal-canvas"></canvas>
        </div>
    </div>
    <div class="controls-panel">
        <div class="slider-container">
            <label for="recursion-depth">Recursion Depth</label>
            <input type="range" id="recursion-depth" min="1" max="10" value="5" role="slider" aria-valuemin="1" aria-valuemax="10" aria-valuenow="5" tabindex="0">
            <div class="value" id="recursion-depth-value">5</div>
        </div>
        <div class="slider-container">
            <label for="point-count">Point Count</label>
            <input type="range" id="point-count" min="100" max="10000" value="1000" role="slider" aria-valuemin="100" aria-valuemax="10000" aria-valuenow="1000" tabindex="0">
            <div class="value" id="point-count-value">1000</div>
        </div>
        <div class="fixed-buttons">
            <button id="start-btn" class="fade-in" tabindex="0">Start</button>
            <button id="export-btn" class="fade-in" tabindex="0">
                Export <span class="export-format">PNG</span>
            </button>
            <button id="clear-btn" class="fade-in" tabindex="0">Clear</button>
        </div>
        <div class="sliders-container">
            <div class="slider-container">
                <label for="recursion-depth">Recursion Depth</label>
                <input type="range" id="recursion-depth" min="1" max="10" value="5" role="slider" aria-valuemin="1" aria-valuemax="10" aria-valuenow="5" tabindex="0">
                <div class="value" id="recursion-depth-value">5</div>
            </div>
            <div class="slider-container">
                <label for="point-count">Point Count</label>
                <input type="range" id="point-count" min="100" max="10000" value="1000" role="slider" aria-valuemin="100" aria-valuemax="10000" aria-valuenow="1000" tabindex="0">
                <div class="value" id="point-count-value">1000</div>
            </div>
        </div>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
    <footer>
        <div class="container">
            <p>© 2023 Fractal Visualizer. All rights reserved.</p>
        </div>
    </footer>
</body>
    <!-- Модальное окно экспорта -->
    <div id="export-modal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close" aria-label="Close modal">×</button>
                <h2>Export Complete</h2>
            </div>
            <div class="modal-body">
                <p>Your fractal has been exported successfully!</p>
                <p id="export-filename"></p>
            </div>
            <div class="modal-footer">
                <button id="close-modal-btn" class="modal-button">Close</button>
            </div>
        </div>
    </div>
</html>
