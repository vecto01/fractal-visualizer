<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Quick fix for loading spinner overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .loading-overlay.hidden {
      display: none;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p>Loading fractal...</p>
  </div>

  <div class="controls-panel fade-in">
    <button class="button" id="resetView">Reset View</button>
    <button class="button" id="changeColors">Change Colors</button>

    <div class="slider-container">
      <label for="iterations">Iterations</label>
      <input type="range" id="iterations" min="1" max="100" value="50">
    </div>
    <div class="slider-container">
      <label for="zoom">Zoom</label>
      <input type="range" id="zoom" min="0.1" max="2" step="0.1" value="1">
    </div>
  </div>

  <div class="fractal-container fade-in" id="fractalContainer">
    <canvas id="fractalCanvas"></canvas>
  </div>

  <div class="footer fade-in">© 2024 Fractal Visualizer</div>

  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script src="js/fractal.js"></script>
</body>
</html>
