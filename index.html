<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Visualizer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Theme Toggle (fixed) -->
  <div class="theme-toggle">
    <button id="themeToggle">Dark Mode</button>
  </div>

  <!-- Loading Screen -->
  <div class="loading-container" id="loadingScreen">
    <div class="loader"></div>
    <div class="loading-text">Loading fractal...</div>
    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Fractal Container -->
  <div class="fractal-container">
    <canvas id="fractalCanvas"></canvas>
  </div>

  <!-- Controls Panel (fixed for all devices) -->
  <div class="controls" id="controlsPanel">
    <div class="slider-container">
      <label class="slider-label" for="iterationsSlider">Iterations</label>
      <input type="range" id="iterationsSlider" class="slider" min="1" max="100" value="50">
      <span class="slider-value" id="iterationsValue">50</span>
    </div>
    <div class="slider-container">
      <label class="slider-label" for="zoomSlider">Zoom</label>
      <input type="range" id="zoomSlider" class="slider" min="0.1" max="2" step="0.1" value="1">
      <span class="slider-value" id="zoomValue">1.0</span>
    </div>
    <button class="button" id="resetButton">Reset View</button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    Fractal Visualizer | Press F12 for DevTools
  </footer>

  <script src="script.js"></script>
</body>
</html>
