<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fractal Visualizer</title>
  <link rel="stylesheet" href="styles/updated.css">
  <style>
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 101;
      background: rgba(0, 0, 0, 0.7);
      color: var(--text-light);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .controls.active {
      transform: translateY(0);
    }
    .loading-complete {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: var(--text-light);
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      display: none;
      animation: fadeOut 1s ease-out forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading fractal...</p>
  </div>

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="controls active" id="controlsPanel">
    <button class="button" id="resetView">Reset View</button>
    <button class="button" id="changeColors">Change Colors</button>

    <div class="slider-container">
      <label for="iterations">Iterations: <span id="iterations-value">50</span></label>
      <input type="range" id="iterations" min="1" max="100" value="50">
    </div>
    <div class="slider-container">
      <label for="zoom">Zoom: <span id="zoom-value">1</span></label>
      <input type="range" id="zoom" min="0.1" max="2" step="0.1" value="1">
    </div>
  </div>

  <div class="fractal-container fade-in" id="fractalContainer"></div>

  <div class="footer fade-in">© 2024 Fractal Visualizer</div>

  <div class="loading-complete" id="loadingComplete">
    Fractal loaded!<br>Ready to explore.</div>

  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script src="js/fractal.js"></script>
</body>
</html>
