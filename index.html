<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading">
        <div class="container">
            <h1>Fractal Visualizer</h1>
            <div class="loading-spinner"></div>
            <div class="loading-message">Loading fractal...</div>
            <div id="progress-container">
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="indicator"></div>
            </div>
            <button id="start-visualization-btn" class="fade-in">Start Visualization</button>
        </div>
    </div>
    <div class="container" id="fractal-container">
        <div class="success-message" id="success-message">Visualization complete!</div>
        <div id="canvas-container">
            <canvas id="fractal-canvas"></canvas>
        </div>
        <div class="slider-container">
            <label for="recursion-depth">Recursion Depth</label>
            <input type="range" id="recursion-depth" min="1" max="10" value="5">
            <div class="value" id="recursion-depth-value">5</div>
        </div>
        <div class="slider-container">
            <label for="point-count">Point Count</label>
            <input type="range" id="point-count" min="100" max="10000" value="1000">
            <div class="value" id="point-count-value">1000</div>
        </div>
        <div class="fixed-buttons">
            <button id="start-btn" class="fade-in">Start</button>
            <button id="export-btn" class="fade-in">Export</button>
            <button id="clear-btn" class="fade-in">Clear</button>
        </div>
    </div>
    <script src="script.js"></script>
    <footer>
        <div class="container">
            <p>© 2023 Fractal Visualizer. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
